<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мои заказы Ozon</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header h1 { font-size: 24px; font-weight: 700; }
.download-btn { background: #005bff; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.download-btn:hover { background: #004de0; }
.filters { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; background: white; padding: 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label { font-size: 12px; font-weight: 600; color: #666; }
.filter-group input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 140px; }
.search-group { flex: 1 1 250px; display: flex; flex-direction: column; gap: 4px; }
.search-group input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 100%; }
.search-group input:focus { border-color: #005bff; outline: none; box-shadow: 0 0 0 2px rgba(0,91,255,0.15); }
.summary { margin-left: auto; font-size: 14px; font-weight: 600; color: #333; align-self: center; white-space: nowrap; }
.table-wrapper { background: white; border-radius: 12px; overflow: auto; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
table { width: 100%; border-collapse: collapse; }
thead { background: #fafafa; position: sticky; top: 0; z-index: 1; }
th { text-align: left; padding: 12px 16px; font-size: 13px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #eee; cursor: pointer; user-select: none; white-space: nowrap; }
th.nosort { cursor: default; }
th:hover:not(.nosort) { color: #005bff; }
th.active-sort { color: #005bff !important; background: #e8f0fe !important; }
th.sort-flash { animation: sort-flash-anim 0.4s ease; }
@keyframes sort-flash-anim {
  0% { background: #005bff; color: white; }
  50% { background: #4080ff; color: white; }
  100% { background: #e8f0fe; color: #005bff; }
}
.sort-arrow::after { content: ''; }
.sort-arrow::before { content: ' ⇅'; opacity: 0.2; font-size: 11px; }
.sort-arrow.asc::before { content: ' ▲'; opacity: 1; color: #005bff; font-size: 12px; }
.sort-arrow.desc::before { content: ' ▼'; opacity: 1; color: #005bff; font-size: 12px; }
tr { border-bottom: 1px solid #f0f0f0; }
tr:nth-child(odd) { background: #ffffff; }
tr:nth-child(even) { background: #f7f7f7; }
tr:hover { background: #f0f4ff !important; }
td { padding: 12px 16px; vertical-align: top; }
td a { color: #005bff; text-decoration: none; font-weight: 500; }
td a:hover { text-decoration: underline; }
.images-cell { width: 80px; min-width: 60px; text-align: center; }
.product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; transition: opacity 0.15s; }
.product-img:hover { opacity: 0.8; }
.name-cell { max-width: 400px; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.status-cell { white-space: nowrap; }
.product-img:hover { opacity: 0.8; }
.price-cell { font-weight: 600; white-space: nowrap; text-align: right; }
.img-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 99999; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.img-modal img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); cursor: default; }
@media (max-width: 768px) { .filters { flex-direction: column; align-items: stretch; } .filter-group input { width: 100%; } .summary { margin-left: 0; text-align: center; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Мои заказы Ozon</h1>
      <button class="download-btn" id="downloadBtn">Скачать HTML</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label>Дата от:</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="filter-group">
        <label>Дата до:</label>
        <input type="date" id="dateTo">
      </div>
      <div class="filter-group">
        <label>Цена от:</label>
        <input type="number" id="priceFrom" placeholder="₽" min="0">
      </div>
      <div class="filter-group">
        <label>Цена до:</label>
        <input type="number" id="priceTo" placeholder="₽" min="0">
      </div>
      <div class="search-group">
        <label>Поиск:</label>
        <input type="text" id="searchInput" placeholder="Название, номер заказа...">
      </div>
      <div class="summary" id="summary"></div>
    </div>

    <div class="table-wrapper">
      <table id="ordersTable">
        <thead>
          <tr>
            <th class="nosort">Картинка</th>
            <th data-sort="name">Название <span class="sort-arrow"></span></th>
            <th data-sort="id">№ Заказа <span class="sort-arrow"></span></th>
            <th data-sort="date">Дата <span class="sort-arrow"></span></th>
            <th data-sort="status">Статус <span class="sort-arrow"></span></th>
            <th data-sort="price">Сумма <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="6">Загрузка данных...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="result.js"></script>
</body>
</html>
